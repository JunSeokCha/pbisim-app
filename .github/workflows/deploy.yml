name: test-and-deploy

# Runs the test suite against the current pbisim-app + the private pbisim engine,
# and triggers a Render deploy ONLY when tests pass. Fires on:
#   - push to main (app changes)
#   - repository_dispatch "pbisim-updated" (engine changes — see the companion
#     workflow installed in the pbisim repo)
#   - manual dispatch
#
# Until you configure deployment it auto-skips (stays green) — the real work only
# runs once the PBISIM_TOKEN secret exists.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   PBISIM_TOKEN            read-only fine-grained PAT for the pbisim repo
#   RENDER_DEPLOY_HOOK_URL  Render service "Deploy Hook" URL

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [pbisim-updated]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment is configured
        id: cfg
        env:
          PBISIM_TOKEN: ${{ secrets.PBISIM_TOKEN }}
        run: |
          if [ -z "$PBISIM_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment not configured yet (PBISIM_TOKEN secret is unset) — skipping test/deploy. See DEPLOY.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.configured == 'true'

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.configured == 'true'
        with:
          python-version: "3.11"

      - name: Resolve pbisim ref
        if: steps.cfg.outputs.configured == 'true'
        id: ref
        run: echo "ref=${{ github.event.client_payload.ref || 'main' }}" >> "$GITHUB_OUTPUT"

      - name: Install pbisim + pbisim-fit (private) + app + pytest
        if: steps.cfg.outputs.configured == 'true'
        env:
          PBISIM_TOKEN: ${{ secrets.PBISIM_TOKEN }}
          PBISIM_REF: ${{ steps.ref.outputs.ref }}
          # pbisim-fit powers the Calibration NLS fit; the tests exercise it. Reuse
          # PBISIM_TOKEN when PBISIM_FIT_TOKEN is unset (mirrors the Dockerfile) — the
          # fine-grained PAT must be able to read BOTH private repos. torch is NOT
          # installed: `import pbisim_fit` is lazy (torch loads only for NPE, unused here).
          PBISIM_FIT_TOKEN: ${{ secrets.PBISIM_FIT_TOKEN }}
          PBISIM_FIT_REF: ${{ github.event.client_payload.ref || 'main' }}
        run: |
          pip install "git+https://${PBISIM_TOKEN}@github.com/phage-therapy-sim/pbisim.git@${PBISIM_REF}"
          FIT_TOKEN="${PBISIM_FIT_TOKEN:-$PBISIM_TOKEN}"
          pip install "git+https://${FIT_TOKEN}@github.com/phage-therapy-sim/pbisim-fit.git@${PBISIM_FIT_REF}"
          # [onnx] installs onnxruntime (torch-free) so the amortized-inference tests
          # actually RUN in CI instead of skipping (importorskip). GitHub's Ubuntu
          # runners have a modern libstdc++, so onnxruntime imports cleanly here.
          pip install -e '.[onnx]'
          pip install pytest

      - name: Run test suite
        if: steps.cfg.outputs.configured == 'true'
        run: python -m pytest tests/ -q

      - name: Trigger Render deploy
        if: steps.cfg.outputs.configured == 'true' && success()
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
