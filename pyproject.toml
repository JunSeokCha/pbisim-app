[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbisim-app"
version = "0.1.0"
description = "AI-powered simulation interface for pbisim phage-bacteria interaction models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pbisim>=1.0",
    "anthropic>=0.30",
    "streamlit>=1.35",
    "matplotlib>=3.7",
    "numpy>=1.24",
]

[project.optional-dependencies]
fit = [
    "pbisim-fit>=0.1",     # parameter estimation integration
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
pbisim-app = "pbisim_app.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pbisim_app*"]
