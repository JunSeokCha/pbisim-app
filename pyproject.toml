[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbisim-app"
version = "0.1.0"
description = "AI-powered simulation interface for pbisim phage-bacteria interaction models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pbisim>=1.0",
    "anthropic>=0.30",
    "streamlit>=1.35",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "plotly>=5.0",
    "pandas>=1.5",
]

[project.optional-dependencies]
fit = [
    # PLANNED, not yet wired up. pbisim-app is a validated feasibility prototype;
    # full development (incl. this fit integration) is deferred until pbisim-fit
    # v1.0 ships. Intended hook: pbisim_fit.output.to_model_config. See
    # ../ECOSYSTEM.md §3.5 / §5.3.
    "pbisim-fit>=0.1",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
pbisim-app = "pbisim_app.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pbisim_app*"]
