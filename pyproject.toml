[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbisim-app"
version = "0.1.0"
description = "AI-powered simulation interface for pbisim phage-bacteria interaction models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pbisim>=1.0",
    "anthropic>=0.30",
    "streamlit>=1.35",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "plotly>=5.0",
    "pandas>=1.5",
]

[project.optional-dependencies]
fit = [
    # WIRED UP: the Calibration page runs pbisim-fit's NLS (imported lazily, so the
    # app starts torch-free). pbisim-fit is PRIVATE (not on PyPI), so this extra is a
    # marker only — install it from the private repo instead:
    #   local dev : pip install -e ../pbisim-fit
    #   deploy    : the Dockerfile installs it from GitHub (see PBISIM_FIT_* build args)
    # Do NOT add the pbisim-fit[sbi]/[neural_ode] extras — they pull torch (~2 GB).
    "pbisim-fit>=0.1",
]
dev = [
    "pytest>=7.4",
]
desktop = [
    # Wraps the local Streamlit server in a native OS window (`pbisim-app-desktop`).
    # Additive: the browser mode and the Render deploy don't need it. On Linux it also
    # needs a system webview lib (e.g. `apt install gir1.2-webkit2-4.1 python3-gi`).
    "pywebview>=5.0",
]
scripting = [
    # A real code editor (Ace: Tab-indent, auto-indent, syntax highlighting, line
    # numbers, Ctrl/Cmd+Enter to run) for the opt-in Scripting page. Frontend-only
    # component — no heavy deps. Falls back to a plain st.text_area when absent, so the
    # base deploy is unaffected; install this only where scripting is enabled.
    "streamlit-code-editor>=0.1.20",
]

[project.scripts]
pbisim-app = "pbisim_app.cli:main"
pbisim-app-desktop = "pbisim_app.desktop:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pbisim_app*"]
