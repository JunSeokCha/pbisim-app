# >>> TEMPLATE — copy this into the PRIVATE `pbisim` repo at
# >>> .github/workflows/notify-pbisim-app.yml   (it does NOT belong in pbisim-app)
#
# On every push to pbisim's main branch, this fires a repository_dispatch event
# in pbisim-app, which runs pbisim-app's test-and-deploy workflow against the new
# engine commit (and deploys to Render only if the tests pass).
#
# Required secret in the pbisim repo:
#   PBISIM_APP_DISPATCH_TOKEN  a fine-grained PAT with "Contents: read" +
#                              "Actions" (or classic `repo`) scope on the
#                              phage-therapy-sim/pbisim-app repository.

name: notify-pbisim-app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pbisim-app test-and-deploy
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.PBISIM_APP_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/phage-therapy-sim/pbisim-app/dispatches \
            -d '{"event_type":"pbisim-updated","client_payload":{"ref":"${{ github.sha }}"}}'
